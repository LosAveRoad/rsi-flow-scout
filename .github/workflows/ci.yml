name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test and build rsi-flow-react
        working-directory: packages/rsi-flow-react
        run: |
          npm install
          npm test
          npm run build

      - name: Test and build rsi-flow-visual
        working-directory: packages/rsi-flow-visual
        run: |
          npm install
          npm test
          npm run build
